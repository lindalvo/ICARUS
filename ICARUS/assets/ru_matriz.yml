log:
  filename: "__RU_LOG_FILENAME__"
  level: error

ru_emu:
  cells:
    - bandwidth: __RU_BANDWIDTH_MHZ__
      network_interface: __RU_IF__

      ru_mac_addr: "__RU_MAC__"
      du_mac_addr: "__DU_MAC__"

      enable_promiscuous: false

      dl_port_id: [__DL_PORT_ID__]
      ul_port_id: [__UL_PORT_ID__]
      prach_port_id: [__PRACH_PORT_ID__]

      compr_method_ul: "bfp"
      compr_bitwidth_ul: 9
      t2a_max_cp_dl: 590
      t2a_min_cp_dl: 250
      t2a_max_cp_ul: 590
      t2a_min_cp_ul: 150
      t2a_max_up: 300
      t2a_min_up: 60
