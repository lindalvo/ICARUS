test_mode:
  test_ue:
    rnti: 0x44
    nof_ues: 8
    ri: 1
    cqi: 7
    pusch_active: true
    pdsch_active: true

expert_execution:
  cell_affinities:
    - ru_cpus: 5,7
      ru_pinning: mask
    - ru_cpus: 9,11
      ru_pinning: mask
    - ru_cpus: 13,15
      ru_pinning: mask
    - ru_cpus: 17,19
      ru_pinning: mask
  threads:
    upper_phy:
      pdsch_processor_type: flexible
      pdsch_cb_batch_length: synchronous
      max_pucch_concurrency: 1
      max_pusch_and_srs_concurrency: 1
      max_pdsch_concurrency: 1
    lower_phy:
      execution_profile: dual

  queues:
    cu_up_dl_ue_executor_queue_size: 8192
    cu_up_ul_ue_executor_queue_size: 8192
    cu_up_ctrl_ue_executor_queue_size: 8192
    cu_up_strand_batch_size: 256
    du_ue_data_executor_queue_size: 16384

